# docker-compose.yml
services:
  # ------------------------------------------------------------
  # Egress Control Proxy (Squid: 外部向け通信の監査・遮断専任)
  # ------------------------------------------------------------
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: egress-proxy
    ports:
      - "${HOST_BIND:-0.0.0.0}:${SQUID_PORT:-3128}:3128" # 監査用フォワードプロキシ
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/whitelist.txt:/etc/squid/whitelist.txt:ro
      - ./logs/squid:/var/log/squid
    networks:
      - internal-net
      - external-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    healthcheck:
      test: ["CMD", "pidof", "squid"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ------------------------------------------------------------
  # Ingress Reverse Proxy (Nginx: ホストから内部への画面・ACP中継専任)
  # WebSocket (noVNC) も完全サポート
  # ------------------------------------------------------------
  ingress-proxy:
    image: nginx:alpine
    container_name: ingress-proxy
    ports:
      - "${HOST_BIND:-0.0.0.0}:${NOVNC_PORT:-6080}:6080" # noVNC (ブラウザ接続用Web UI & WebSocket)
      - "${HOST_BIND:-0.0.0.0}:${GOOSE_SERVE_PORT:-3284}:3284" # Goose ACP サーバー用
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - internal-net
      - external-net
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    depends_on:
      - egress-proxy

  # ------------------------------------------------------------
  # Goose Agent Container (隔離作業環境)
  # ------------------------------------------------------------
  goose-agent:
    build:
      context: .
      dockerfile: goose/Dockerfile
    container_name: goose-agent
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - http_proxy=http://egress-proxy:3128
      - https_proxy=http://egress-proxy:3128
      - NO_PROXY=localhost,127.0.0.1
      - GOOSE_TELEMETRY_ENABLED=${GOOSE_TELEMETRY_ENABLED:-false}
      - RESOLUTION=${RESOLUTION:-1280x800x24}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - GTK_IM_MODULE=fcitx
      - QT_IM_MODULE=fcitx
      - XMODIFIERS=@im=fcitx
      - TZ=${TZ:-Asia/Tokyo}
      - GOOSE_DISABLE_KEYRING=1
      - CONTEXT_FILE_NAMES=.goosehints,AGENTS.md
      # --- LLM プロバイダー（使用するキー・エンドポイントのみ選択的に注入） ---
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_HOST=${OPENAI_HOST:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_HOST=${ANTHROPIC_HOST:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - GOOSE_PROVIDER=${GOOSE_PROVIDER:-}
      - GOOSE_MODEL=${GOOSE_MODEL:-}
    shm_size: '${SHM_SIZE:-1gb}'
    command: /bin/start-desktop.sh
    volumes:
      - ./workspace:/workspace:rw
      - ./bin:/bin/host-scripts:ro
      - ./bin/start-desktop.sh:/bin/start-desktop.sh:ro
      - ./bin/start-goose.sh:/bin/start-goose.sh:ro
      - ./bin/test-egress.sh:/bin/test-egress.sh:ro
      - ./config:/home/sandboxuser/.config/goose:rw
      - ./data/sessions:/home/sandboxuser/.local/share/goose/sessions:rw
      - ./data/logs:/home/sandboxuser/.local/state/goose/logs:rw
      - ./logs/squid:/var/log/squid:ro
    working_dir: /workspace
    networks:
      - internal-net
    depends_on:
      egress-proxy:
        condition: service_healthy

  # Dozzle - Lightweight Log Viewer (Web リアルタイムログ監視)
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "${HOST_BIND:-0.0.0.0}:${DOZZLE_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  internal-net:
    driver: bridge
    internal: true  # カーネルレベルで外部への直接ルーティングを100%遮断

  external-net:
    driver: bridge  # プロキシのみが外部と通信可能
