# squid.conf
# ==========================================
# Squid Forward Proxy - AI エージェント外部通信制御 (Egress 専任)
# Docker 内部ネットワークからのみ接続を受け付ける
# ==========================================

# ポート定義
acl SSL_ports port 443
acl Safe_ports port 80          # HTTP
acl Safe_ports port 443         # HTTPS
acl Safe_ports port 11434       # Ollama (ローカルLLM)
acl CONNECT method CONNECT

# 安全でないポート・非SSL CONNECT を拒否
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Docker 内部ネットワーク (internal-net) からのアクセスを許可
# RFC 1918 プライベートアドレス空間
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 127.0.0.1/32

# Ollama ローカル LLM 用ポート制限
acl ollama_port port 11434
acl ollama_host dstdomain host.docker.internal

# ==========================================
# ドメインホワイトリスト（外部ファイルから読み込み）
# ==========================================
acl allowed_domains dstdomain "/etc/squid/whitelist.txt"

# アクセスルール: 内部ネットワークからの許可ドメイン宛てのみ通過
http_access allow localnet ollama_host ollama_port
http_access allow localnet allowed_domains

# それ以外の外部通信はすべて拒否 (403 Forbidden)
http_access deny all

# フォワードプロキシポート (エージェント外部通信用)
http_port 3128

# 運用設定
visible_hostname goose-box-proxy
shutdown_lifetime 1 seconds

# ヘルスチェック (127.0.0.1 からのヘッダーなし接続) のログ除外
acl healthcheck_src src 127.0.0.1/32

# ==========================================
# JSON 構造化監査ログ
# ==========================================
# 全通信（許可・遮断とも）を JSON 形式で詳細に記録
logformat json_audit {"time":"%{%Y-%m-%dT%H:%M:%S%z}tl","client":"%>a","status":%>Hs,"squid_status":"%Ss","method":"%rm","url":"%ru","domain":"%>rd","bytes_sent":%<st,"bytes_received":%>st,"duration_ms":%tr,"user_agent":"%{User-Agent}>h","content_type":"%{Content-Type}>h","referer":"%{Referer}>h"}
access_log /var/log/squid/access.json json_audit !healthcheck_src

# デバッグ・即時閲覧用テキストログ
logformat audit_text [%tl] client:%>a status:%>Hs squid:%Ss method:%rm url:%ru domain:%>rd
access_log /var/log/squid/access.log audit_text !healthcheck_src


