# squid/squid.conf
# ==========================================
# Squid Forward Proxy Configuration for AI Agent Egress Control
# ==========================================

# Port Definitions
acl SSL_ports port 443
acl Safe_ports port 80          # HTTP
acl Safe_ports port 443         # HTTPS
acl CONNECT method CONNECT

# Deny unsafe ports and non-SSL CONNECT requests
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Local network ranges (Docker internal bridge networks)
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# ==========================================
# Domain Whitelist（外部ファイルから読み込み）
# ==========================================
# 許可ドメインは /etc/squid/whitelist.txt で管理
acl allowed_domains dstdomain "/etc/squid/whitelist.txt"

# Access Rules: allow only permitted domains from internal net
http_access allow localnet allowed_domains

# Deny everything else
http_access deny all

# Proxy listening port
http_port 3128

# Operational settings
visible_hostname egress-proxy
shutdown_lifetime 1 seconds
access_log daemon:/var/log/squid/access.log squid
