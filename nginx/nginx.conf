# nginx/nginx.conf
# ==========================================================
# Ingress Reverse Proxy: ホストから内部コンテナへの安全な中継
# HTTP および WebSocket (noVNC) を透過的に転送
# ==========================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Ingress 監査ログ（JSON 構造化）
    log_format json_ingress escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"upstream":"$upstream_addr",'
        '"user_agent":"$http_user_agent",'
        '"connection_upgrade":"$http_upgrade"}';

    access_log /var/log/nginx/ingress.json json_ingress;

    # Docker 組み込み DNS サーバー (動的名前解決: コンテナ起動前でもクラッシュさせない)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # WebSocket アップグレード用のマッピング
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 6080;
        server_name localhost 127.0.0.1;

        # 統合コントロールパネル API & Web UI
        location = /control {
            return 301 /control/;
        }

        location /control/ {
            set $upstream_control "http://control-panel:8000";
            rewrite ^/control/(.*)$ /$1 break;
            proxy_pass $upstream_control;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /control;

            # キャッシュ無効化
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 可観測性ダッシュボード & LLM API (HTML / JSON / Markdown)
        location /report/ {
            alias /usr/share/nginx/html/report/;
            index index.html;

            # UTF-8 文字コードを明示（ブラウザでの Markdown / テキスト文字化け防止）
            charset utf-8;
            charset_types text/plain text/markdown application/json;

            # キャッシュによる古い監査情報の残存を防止
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            # LLM や別オリジンからの API 取得 (CORS) 許可
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

            # MIME タイプの補正
            types {
                text/html                             html htm;
                application/json                      json;
                text/markdown                         md;
                text/plain                            txt;
                text/css                              css;
                application/javascript                js;
            }
        }

        # noVNC Web UI および WebSocket (/websockify) のプロキシ
        location / {
            set $upstream_novnc "http://goose-agent:6080";
            proxy_pass $upstream_novnc;
            proxy_http_version 1.1;

            # WebSocket 対応ヘッダー
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ホスト・クライアント情報
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # タイムアウト延長（画面切断防止）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    server {
        listen 3284;
        server_name localhost 127.0.0.1;

        # Goose ACP サーバーのプロキシ
        location / {
            set $upstream_acp "http://goose-agent:3284";
            proxy_pass $upstream_acp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 6081;
        server_name localhost 127.0.0.1;

        # OpenCode noVNC Web UI および WebSocket のプロキシ
        location / {
            set $upstream_opencode "http://opencode-agent:6081";
            proxy_pass $upstream_opencode;
            proxy_http_version 1.1;

            # WebSocket 対応ヘッダー
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ホスト・クライアント情報
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # タイムアウト延長（画面切断防止）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Ingress 監査ログの記録
            access_log /var/log/nginx/ingress.json json_ingress;
        }
    }

    server {
        listen 6082;
        server_name localhost 127.0.0.1;

        # OpenClaw noVNC Web UI および WebSocket のプロキシ
        location / {
            set $upstream_openclaw_novnc "http://openclaw-agent:6082";
            proxy_pass $upstream_openclaw_novnc;
            proxy_http_version 1.1;

            # WebSocket 対応ヘッダー
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ホスト・クライアント情報
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # タイムアウト延長（画面切断防止）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Ingress 監査ログの記録
            access_log /var/log/nginx/ingress.json json_ingress;
        }
    }

    server {
        listen 18789;
        server_name localhost 127.0.0.1;

        # OpenClaw Control UI および WebSocket のプロキシ
        location / {
            set $upstream_openclaw_control "http://openclaw-agent:18789";
            proxy_pass $upstream_openclaw_control;
            proxy_http_version 1.1;

            # WebSocket 対応ヘッダー
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ホスト情報 (OpenClaw のプロキシ属性要件対策として X-Forwarded-* は転送しない)
            proxy_set_header Host $host;

            # タイムアウト延長（画面切断防止）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Ingress 監査ログの記録
            access_log /var/log/nginx/ingress.json json_ingress;
        }
    }

}
