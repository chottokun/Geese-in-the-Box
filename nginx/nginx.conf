# nginx/nginx.conf
# ==========================================================
# Ingress Reverse Proxy: ホストから内部コンテナへの安全な中継
# HTTP および WebSocket (noVNC) を透過的に転送
# ==========================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker 組み込み DNS サーバー (動的名前解決: コンテナ起動前でもクラッシュさせない)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # WebSocket アップグレード用のマッピング
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 6080;
        server_name localhost 127.0.0.1;

        # noVNC Web UI および WebSocket (/websockify) のプロキシ
        location / {
            set $upstream_novnc "http://goose-agent:6080";
            proxy_pass $upstream_novnc;
            proxy_http_version 1.1;

            # WebSocket 対応ヘッダー
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ホスト・クライアント情報
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # タイムアウト延長（画面切断防止）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    server {
        listen 3284;
        server_name localhost 127.0.0.1;

        # Goose ACP サーバーのプロキシ
        location / {
            set $upstream_acp "http://goose-agent:3284";
            proxy_pass $upstream_acp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
