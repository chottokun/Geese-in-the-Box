#cloud-config
# ==========================================
# Goose-in-the-Box VM プロビジョニング
# ==========================================
# Multipass + cloud-init で VM を自動構築する。
# 使用方法: multipass launch --name goose-box --cloud-init vm/cloud-init.yaml

package_update: true
package_upgrade: true

packages:
  # Squid プロキシ
  - squid
  # 監査ツール
  - goaccess
  - jq
  # 開発ツール
  - curl
  - git
  - ripgrep
  - bzip2
  - ca-certificates
  # GUI デスクトップ環境
  - xfce4
  - xfce4-terminal
  - xrdp
  - dbus-x11
  # ファイアウォール
  - iptables
  - iptables-persistent
  # ログ管理
  - logrotate

# goose ユーザーの作成
users:
  - default
  - name: goose
    shell: /bin/bash
    sudo: false
    groups: []

write_files:
  # システム全体のプロキシ強制設定
  - path: /etc/environment
    append: true
    content: |
      HTTP_PROXY=http://127.0.0.1:3128
      HTTPS_PROXY=http://127.0.0.1:3128
      http_proxy=http://127.0.0.1:3128
      https_proxy=http://127.0.0.1:3128
      NO_PROXY=localhost,127.0.0.1
      GOOSE_TELEMETRY_ENABLED=false

  # goose ユーザー用の .bashrc にもプロキシ設定を追加
  - path: /home/goose/.bashrc
    owner: goose:goose
    permissions: '0644'
    append: true
    content: |
      # Squid プロキシ強制設定
      export HTTP_PROXY=http://127.0.0.1:3128
      export HTTPS_PROXY=http://127.0.0.1:3128
      export http_proxy=http://127.0.0.1:3128
      export https_proxy=http://127.0.0.1:3128
      export NO_PROXY=localhost,127.0.0.1
      export GOOSE_TELEMETRY_ENABLED=false

  # Squid 設定
  - path: /etc/squid/squid.conf
    content: |
      # squid.conf - AI エージェント外部通信制御
      acl SSL_ports port 443
      acl Safe_ports port 80
      acl Safe_ports port 443
      acl CONNECT method CONNECT
      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      acl localnet src 127.0.0.0/8
      acl allowed_domains dstdomain "/etc/squid/whitelist.txt"
      http_access allow localnet allowed_domains
      http_access deny all
      http_port 3128
      visible_hostname goose-box-proxy
      shutdown_lifetime 1 seconds
      logformat json_audit {"time":"%{%Y-%m-%dT%H:%M:%S%z}tl","client":"%>a","status":%>Hs,"squid_status":"%Ss","method":"%rm","url":"%ru","domain":"%>rd","bytes_sent":%<st,"bytes_received":%>st,"duration_ms":%tr}
      access_log /var/log/squid/access.json json_audit
      logformat audit_text [%tl] client:%>a status:%>Hs squid:%Ss method:%rm url:%ru domain:%>rd
      access_log /var/log/squid/access.log audit_text

  # ドメインホワイトリスト
  - path: /etc/squid/whitelist.txt
    content: |
      # ドメインホワイトリスト
      # サブドメイン全体を許可する場合は先頭にドット
      # --- OpenAI ---
      .openai.com
      # --- Anthropic (Claude) ---
      .anthropic.com
      # --- Google (Gemini) ---
      .googleapis.com
      # --- Azure OpenAI ---
      .openai.azure.com
      .cognitiveservices.azure.com
      # --- AWS Bedrock ---
      .amazonaws.com
      # --- Mistral AI ---
      .mistral.ai
      # --- Groq ---
      .groq.com
      # --- OpenRouter ---
      .openrouter.ai
      # --- Together AI ---
      .together.ai
      .together.xyz
      # --- Cohere ---
      .cohere.ai
      .cohere.com
      # --- GitHub ---
      github.com
      api.github.com

  # iptables 遮断ルール
  - path: /opt/goose-box/iptables-rules.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      iptables -F OUTPUT
      iptables -F INPUT
      iptables -P OUTPUT DROP
      iptables -P INPUT DROP
      iptables -A OUTPUT -o lo -j ACCEPT
      iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
      iptables -A OUTPUT -m owner --uid-owner proxy -p tcp --dport 443 -j ACCEPT
      iptables -A OUTPUT -m owner --uid-owner proxy -p tcp --dport 80 -j ACCEPT
      iptables -A OUTPUT -m owner --uid-owner proxy -p udp --dport 53 -j ACCEPT
      iptables -A OUTPUT -m owner --uid-owner proxy -p tcp --dport 53 -j ACCEPT
      iptables -A INPUT -i lo -j ACCEPT
      iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
      iptables -A INPUT -p tcp --dport 22 -j ACCEPT
      iptables -A INPUT -p tcp --dport 3389 -j ACCEPT
      iptables -A INPUT -p tcp --dport 5900 -j ACCEPT
      iptables -A INPUT -p tcp --dport 7890 -j ACCEPT

  # 通信遮断テストスクリプト
  - path: /opt/goose-box/bin/test-egress.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      PROXY="http://127.0.0.1:3128"
      PASS=0
      FAIL=0

      echo "=== [1/4] ホワイトリストドメインのテスト (api.openai.com) ==="
      if curl -s -I --proxy "$PROXY" https://api.openai.com 2>&1 | grep -q -E "HTTP/.* (200|401|404)"; then
          echo "  -> OK: プロキシ経由で接続許可"; ((PASS++))
      else
          echo "  -> FAIL: 想定外の応答"; ((FAIL++))
      fi

      echo ""
      echo "=== [2/4] 非許可ドメインのテスト (www.google.com) ==="
      OUTPUT=$(curl -v --proxy "$PROXY" https://www.google.com 2>&1 || true)
      if echo "$OUTPUT" | grep -q -E "403|Forbidden"; then
          echo "  -> OK: プロキシが 403 Forbidden で遮断"; ((PASS++))
      else
          echo "  -> FAIL: 403 が返されなかった"; ((FAIL++))
      fi

      echo ""
      echo "=== [3/4] プロキシバイパスのテスト (直接接続) ==="
      if curl -s --connect-timeout 3 --noproxy "*" https://api.openai.com > /dev/null 2>&1; then
          echo "  -> CRITICAL: プロキシを迂回して外部接続に成功！"; ((FAIL++))
      else
          echo "  -> OK: iptables が直接接続を遮断"; ((PASS++))
      fi

      echo ""
      echo "=== [4/4] 監査ログ記録のテスト ==="
      if [ -f /var/log/squid/access.json ] && [ -s /var/log/squid/access.json ]; then
          LAST_ENTRY=$(tail -1 /var/log/squid/access.json)
          if echo "$LAST_ENTRY" | jq . > /dev/null 2>&1; then
              echo "  -> OK: JSON 監査ログが正常に記録されている"
              echo "  -> 最新エントリ: $LAST_ENTRY"; ((PASS++))
          else
              echo "  -> FAIL: ログが JSON として不正"; ((FAIL++))
          fi
      else
          echo "  -> FAIL: 監査ログファイルが存在しないか空"; ((FAIL++))
      fi

      echo ""
      echo "=== テスト完了: $PASS 成功, $FAIL 失敗 ==="
      [ "$FAIL" -eq 0 ] && exit 0 || exit 1

  # Goose 起動スクリプト
  - path: /opt/goose-box/bin/start-goose.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      WORKSPACE="${GOOSE_WORKSPACE:-/home/goose/workspace}"
      cd "$WORKSPACE"

      SYSTEM_CONTENT=""

      # メインの指示ファイル読み込み
      if [ -f "AGENTS.md" ]; then
          echo "ロード中: AGENTS.md をルールとして適用します"
          SYSTEM_CONTENT="$(cat AGENTS.md)"
      elif [ -f "CLAUDE.md" ]; then
          echo "ロード中: CLAUDE.md をルールとして適用します"
          SYSTEM_CONTENT="$(cat CLAUDE.md)"
      fi

      # 分割ルールファイルの読み込み
      shopt -s nullglob
      RULE_FILES=(.agents/rules/*.md .rules/*.md)
      shopt -u nullglob

      for rule_file in "${RULE_FILES[@]}"; do
          if [ -f "$rule_file" ]; then
              echo "ロード中: $rule_file をルールとして追加適用します"
              if [ -n "$SYSTEM_CONTENT" ]; then
                  SYSTEM_CONTENT="${SYSTEM_CONTENT}

      $(cat "$rule_file")"
              else
                  SYSTEM_CONTENT="$(cat "$rule_file")"
              fi
          fi
      done

      SYSTEM_ARGS=()
      if [ -n "$SYSTEM_CONTENT" ]; then
          SYSTEM_ARGS=(--system "$SYSTEM_CONTENT")
      fi

      exec goose session "${SYSTEM_ARGS[@]}" "$@"

  # logrotate 設定
  - path: /etc/logrotate.d/squid-audit
    content: |
      /var/log/squid/access.json /var/log/squid/access.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          postrotate
              systemctl reload squid 2>/dev/null || true
          endscript
      }

  # GoAccess 設定
  - path: /etc/goaccess/goaccess-json.conf
    content: |
      # GoAccess - Squid JSON 監査ログ解析設定
      json-pretty-print false
      log-format {"time":"%dT%t%^","client":"%h","status":%s,"squid_status":"%^","method":"%m","url":"%U","domain":"%v","bytes_sent":%b,"bytes_received":%^,"duration_ms":%T}
      date-format %Y-%m-%d
      time-format %H:%M:%S

  # GoAccess systemd サービス
  - path: /etc/systemd/system/goaccess-dashboard.service
    content: |
      [Unit]
      Description=GoAccess 監査ダッシュボード
      After=squid.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/goaccess /var/log/squid/access.json --log-format='{"time":"%%dT%%t%%^","client":"%%h","status":%%s,"squid_status":"%%^","method":"%%m","url":"%%U","domain":"%%v","bytes_sent":%%b,"bytes_received":%%^,"duration_ms":%%T}' --date-format=%%Y-%%m-%%d --time-format=%%H:%%M:%%S --real-time-html --ws-url=ws://0.0.0.0:7890 -o /var/www/html/report.html --port=7890
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Squid を起動
  - systemctl enable squid
  - systemctl restart squid

  # iptables 遮断ルールを適用
  - /opt/goose-box/iptables-rules.sh

  # iptables ルールを永続化
  - netfilter-persistent save

  # xrdp を起動（GUI デスクトップ接続用）
  - systemctl enable xrdp
  - systemctl start xrdp

  # goose ユーザーのワークスペースをセットアップ
  - mkdir -p /home/goose/workspace
  - chown -R goose:goose /home/goose

  # Goose CLI のインストール
  - |
    export HTTP_PROXY=http://127.0.0.1:3128
    export HTTPS_PROXY=http://127.0.0.1:3128
    curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh -o /tmp/download_cli.sh
    CONFIGURE=false GOOSE_BIN_DIR=/usr/local/bin bash /tmp/download_cli.sh
    rm /tmp/download_cli.sh

  # GoAccess ダッシュボードを起動
  - mkdir -p /var/www/html
  - systemctl daemon-reload
  - systemctl enable goaccess-dashboard
  - systemctl start goaccess-dashboard

  - echo "=== Goose-in-the-Box VM プロビジョニング完了 ==="
